<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#ffa657"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="418" height="228" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="418" height="228" rx="12" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="120 1170" pathLength="1290">
    <animate attributeName="stroke-dashoffset" from="1290" to="0" dur="5s" begin="-1.7s" repeatCount="indefinite"/>
  </rect>
  <text x="24" y="40" fill="#8b949e" font-size="12">~/projects/</text>
  <text x="24" y="70" fill="#00ff9c" font-size="24" font-weight="700">hotspot-billing</text>
  <!-- wifi signal -->
  <g transform="translate(392 36)" fill="none" stroke="#00ff9c" stroke-width="2.5" stroke-linecap="round">
    <circle r="2.5" fill="#00ff9c" stroke="none"/>
    <path d="M-7 -6A10 10 0 0 1 7 -6"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.8;1" dur="2s" repeatCount="indefinite"/></path>
    <path d="M-12 -11A17 17 0 0 1 12 -11"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.45;.8;1" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <text fill="#c9d1d9" font-size="13">
    <tspan x="24" y="104">Billing system for Wi-Fi hotspots:</tspan>
    <tspan x="24" y="124">plans, payments and access control</tspan>
    <tspan x="24" y="144">for connected users.</tspan>
  </text>
  <g font-size="11" font-weight="700">
    <rect x="24" y="178" width="58" height="24" rx="12" fill="#b07219" fill-opacity="0.18" stroke="#b07219"/>
    <text x="53" y="194" text-anchor="middle" fill="#f0a35e">Java</text>
    <rect x="90" y="178" width="84" height="24" rx="12" fill="#ffa657" fill-opacity="0.18" stroke="#ffa657"/>
    <text x="132" y="194" text-anchor="middle" fill="#ffa657">Billing</text>
    <rect x="182" y="178" width="92" height="24" rx="12" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
    <text x="228" y="194" text-anchor="middle" fill="#79b8ff">Networking</text>
  </g>
</svg>
