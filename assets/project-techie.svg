<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="418" height="228" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="418" height="228" rx="12" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="120 1170" pathLength="1290">
    <animate attributeName="stroke-dashoffset" from="1290" to="0" dur="5s" begin="-3.4s" repeatCount="indefinite"/>
  </rect>
  <text x="24" y="40" fill="#8b949e" font-size="12">~/projects/</text>
  <text x="24" y="70" fill="#00ff9c" font-size="24" font-weight="700">techie-tracker</text>
  <!-- escalation alert pulse -->
  <g transform="translate(390 34)">
    <circle r="5" fill="#ff7b72"/>
    <circle r="5" fill="none" stroke="#ff7b72" stroke-width="2">
      <animate attributeName="r" values="5;14" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text fill="#c9d1d9" font-size="13">
    <tspan x="24" y="104">ISP request &amp; dispatch system: logs</tspan>
    <tspan x="24" y="124">calls, WhatsApp &amp; walk-ins, auto-routes</tspan>
    <tspan x="24" y="144">to tech teams, escalates stale tickets.</tspan>
  </text>
  <g font-size="11" font-weight="700">
    <rect x="24" y="178" width="98" height="24" rx="12" fill="#6db33f" fill-opacity="0.18" stroke="#6db33f"/>
    <text x="73" y="194" text-anchor="middle" fill="#8fd16a">Spring Boot</text>
    <rect x="130" y="178" width="62" height="24" rx="12" fill="#61dafb" fill-opacity="0.15" stroke="#61dafb"/>
    <text x="161" y="194" text-anchor="middle" fill="#61dafb">React</text>
    <rect x="200" y="178" width="96" height="24" rx="12" fill="#336791" fill-opacity="0.3" stroke="#5a8fc0"/>
    <text x="248" y="194" text-anchor="middle" fill="#8ab4e0">PostgreSQL</text>
    <rect x="304" y="178" width="70" height="24" rx="12" fill="#2496ed" fill-opacity="0.18" stroke="#2496ed"/>
    <text x="339" y="194" text-anchor="middle" fill="#6cb8f5">Docker</text>
  </g>
</svg>
